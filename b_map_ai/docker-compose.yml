services:
  # ============================================================================
  # 1. B Map AI Backend API & WebSocket Gateway
  # ============================================================================
  bmap-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bmap_ai_backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/bmap_ai
      - GEMMA_API_URL=http://bmap-gemma:5005
      - AUTO_START_GEMMA=false
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX=120
      - BMAP_API_KEY=${BMAP_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
      bmap-gemma:
        condition: service_started
    networks:
      - bmap_network

  # ============================================================================
  # 2. Gemma 3 (1B) Geospatial LLM Inference Service
  # ============================================================================
  bmap-gemma:
    build:
      context: ./gemma
      dockerfile: Dockerfile
    container_name: bmap_gemma_engine
    restart: unless-stopped
    # Internal inference engine (bound strictly to loopback to prevent public network exposure)
    ports:
      - "127.0.0.1:${GEMMA_PORT:-5005}:5005"
    environment:
      - GEMMA_HOST=0.0.0.0
      - GEMMA_PORT=5005
      - TF_ENABLE_ONEDNN_OPTS=0
    volumes:
      - gemma_cache:/root/.cache/kagglehub
    networks:
      - bmap_network

  # ============================================================================
  # 3. Enterprise MongoDB Persistence
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: bmap_ai_mongodb
    restart: unless-stopped
    # Bound strictly to 127.0.0.1 loopback to prevent remote unauthenticated access
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bmap_network

networks:
  bmap_network:
    driver: bridge

volumes:
  mongo_data:
  gemma_cache:
